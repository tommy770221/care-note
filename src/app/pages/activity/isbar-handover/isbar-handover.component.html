<form [formGroup]="isbarForm" (ngSubmit)="onSubmit()">
    <h3 class="text-center">{{ 'ISBAR.TITLE' | translate }}</h3>
    <div class="form-container">
      <!-- I - 身份 -->
      <div class="section">
        <h2>{{ 'ISBAR.I_TITLE' | translate }}</h2>
        <div class="form-group">
          <label for="myName">{{ 'ISBAR.MY_NAME_LABEL' | translate }}</label>
          <input type="text" id="myName" formControlName="myName" [placeholder]="'ISBAR.MY_NAME_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="receiverName">{{ 'ISBAR.RECEIVER_NAME_LABEL' | translate }}</label>
          <input type="text" id="receiverName" formControlName="receiverName" [placeholder]="'ISBAR.RECEIVER_NAME_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="patientInfo">{{ 'ISBAR.PATIENT_INFO_LABEL' | translate }}</label>
          <input type="text" id="patientInfo" formControlName="patientInfo" [placeholder]="'ISBAR.PATIENT_INFO_PLACEHOLDER' | translate">
        </div>
      </div>
  
      <!-- S - 情況 -->
      <div class="section">
        <h2>{{ 'ISBAR.S_TITLE' | translate }}</h2>
        <div class="form-group">
          <label for="currentIssue">{{ 'ISBAR.CURRENT_ISSUE_LABEL' | translate }}</label>
          <input type="text" id="currentIssue" formControlName="currentIssue" [placeholder]="'ISBAR.CURRENT_ISSUE_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="issueTime">{{ 'ISBAR.ISSUE_TIME_LABEL' | translate }}</label>
          <input type="text" id="issueTime" formControlName="issueTime" [placeholder]="'ISBAR.ISSUE_TIME_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="issueStability">{{ 'ISBAR.ISSUE_STABILITY_LABEL' | translate }}</label>
          <input type="text" id="issueStability" formControlName="issueStability" [placeholder]="'ISBAR.ISSUE_STABILITY_PLACEHOLDER' | translate">
        </div>
      </div>
  
      <!-- B - 背景 -->
      <div class="section">
        <h2>{{ 'ISBAR.B_TITLE' | translate }}</h2>
        <div class="form-group">
          <label for="healthHistory">{{ 'ISBAR.HEALTH_HISTORY_LABEL' | translate }}</label>
          <input type="text" id="healthHistory" formControlName="healthHistory" [placeholder]="'ISBAR.HEALTH_HISTORY_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="recentTreatment">{{ 'ISBAR.RECENT_TREATMENT_LABEL' | translate }}</label>
          <input type="text" id="recentTreatment" formControlName="recentTreatment" [placeholder]="'ISBAR.RECENT_TREATMENT_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="recentCheckup">{{ 'ISBAR.RECENT_CHECKUP_LABEL' | translate }}</label>
          <input type="text" id="recentCheckup" formControlName="recentCheckup" [placeholder]="'ISBAR.RECENT_CHECKUP_PLACEHOLDER' | translate">
        </div>
      </div>
  
      <!-- A - 評估 -->
      <div class="section">
        <h2>{{ 'ISBAR.A_TITLE' | translate }}</h2>
        <div class="form-group">
          <label for="myObservation">{{ 'ISBAR.MY_OBSERVATION_LABEL' | translate }}</label>
          <input type="text" id="myObservation" formControlName="myObservation" [placeholder]="'ISBAR.MY_OBSERVATION_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="possibleCause">{{ 'ISBAR.POSSIBLE_CAUSE_LABEL' | translate }}</label>
          <input type="text" id="possibleCause" formControlName="possibleCause" [placeholder]="'ISBAR.POSSIBLE_CAUSE_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="severity">{{ 'ISBAR.SEVERITY_LABEL' | translate }}</label>
          <input type="text" id="severity" formControlName="severity" [placeholder]="'ISBAR.SEVERITY_PLACEHOLDER' | translate">
        </div>
      </div>
  
      <!-- R - 建議/要求 -->
      <div class="section">
        <h2>{{ 'ISBAR.R_TITLE' | translate }}</h2>
        <div class="form-group">
          <label for="recommendation">{{ 'ISBAR.RECOMMENDATION_LABEL' | translate }}</label>
          <input type="text" id="recommendation" formControlName="recommendation" [placeholder]="'ISBAR.RECOMMENDATION_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="assistanceNeeded">{{ 'ISBAR.ASSISTANCE_NEEDED_LABEL' | translate }}</label>
          <input type="text" id="assistanceNeeded" formControlName="assistanceNeeded" [placeholder]="'ISBAR.ASSISTANCE_NEEDED_PLACEHOLDER' | translate">
        </div>
        <div class="form-group">
          <label for="followUp">{{ 'ISBAR.FOLLOW_UP_LABEL' | translate }}</label>
          <input type="text" id="followUp" formControlName="followUp" [placeholder]="'ISBAR.FOLLOW_UP_PLACEHOLDER' | translate">
        </div>
      </div>
  
      <button type="submit">{{ 'ISBAR.SUBMIT' | translate }}</button>
    </div>
  </form>
